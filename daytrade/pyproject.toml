[project]
name = "daytrade"
version = "0.1.0"
description = "Three day-trading strategies (SPY, QQQ, gold) with their own backtest and a paper auto-trader"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
daytrade = "daytrade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daytrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
