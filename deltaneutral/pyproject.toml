[project]
name = "deltaneutral"
version = "0.1.0"
description = "A two-market delta-neutral position across Arcus and Lighter (Robinhood Chain), renewed every 24 hours"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
deltaneutral = "deltaneutral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltaneutral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
