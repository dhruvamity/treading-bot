[project]
name = "lighter-bot"
version = "0.1.0"
description = "Market-making bot for Lighter perps on Robinhood Chain: recorder, backtest, lists, paper and live runs, Telegram"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    # only for the official transaction signer library it ships (lighter_bot/venue/signer.py loads it with ctypes)
    "lighter-sdk>=1.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
lighter = "lighter_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lighter_bot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108", "RUF012", "ASYNC109", "ASYNC110", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: talks to the live Lighter API (excluded by default; run with -m network)"]
addopts = "-m 'not network' -q"
