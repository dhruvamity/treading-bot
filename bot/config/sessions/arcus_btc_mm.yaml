session_id: arcus_btc_mm
venue: arcus
account_index: 0            # Arcus subaccount 0-9 (own rate pools). Keys are bound to ONE subaccount (403 otherwise); `bot keys` shows yours
market: BTC                 # canonical base; mapped to BTC-USD at start-up
mode: mid                   # mid | grid | rgrid | signal (the pilot writes its own session: pilot.yaml)
live_enabled: false         # triple lock part 2
capital_usd: 35
leverage_max: 5
bias: neutral               # neutral | long_skew | short_skew
bias_size_usd: 0
execution_style: normal     # aggressive | normal | passive
offset_bps: 0               # Tread-style: Mid-1 = -1, Grid +2 = 2
spacing_bps: auto           # Mid: auto = 1-min volatility; Grid/RGrid: auto = auto_spacing below
levels_per_side: auto
order_size_usd: auto        # >= 1.2 x venue minimum (BTC: 0.0001 BTC min size ~ $8.6 -> ~$10.3)
inventory_cap_usd: 30
skew_kappa: 1.0
reset_threshold_pct: 0.25
recentre_after_s: 120
recentre_inventory: skew_exit   # skew_exit | maker_unwind
stop_loss_pct: 10
take_profit_pct: null
participation_cap_pct: 25
requote: {min_ticks: 2, min_frac_of_half_spread: 0.25}
safety_pause: {move_sigma_1s: 6, spread_x_median: 3, depth_frac_min: 0.3, resume_s: 30}
session:
  duration: 8h
  repeat: 20
  windows_ist: []
  skip_events: [cpi, fomc, nfp, earnings]
off_hours: {spacing_mult: 2, size_mult: 0.25, allow_mid: false}
signal: {rsi_len: 14, rsi_low: 25, rsi_high: 75, tp_bps: 15, sl_bps: 25, cooldown_s: 300, max_hold_min: 120}
auto_spacing:               # Grid/RGrid spacing when spacing_bps is auto
  target_fills_per_hour: 20
  k_delta: 1.0
  delta_min_bps: 5
  delta_max_bps: 100
