# Winner of the Arcus-only shoot-out (arcus-mm/research/STRATEGY_SHOOTOUT.md, 2026-09-23): AMD-USD, Mid, 3 bps, no skew.
# Tested at $25 orders / $100 cap: +$2.58 over 92 h of recorded L2 tape, 5 of 5 days positive, positive in all 8 stress
# variants (400 ms RTT, empty action budget, trade-through-only fills, no loss stop, canary size, ...).
# Values below are the CANARY size ($10 / $20, tested: +$0.35 over the same 92 h). Raise to order_size_usd: 25 and
# inventory_cap_usd: 100 only after a paper run and the canary agree with the replay.
# What makes it work (ablation): AMD's book is wide (median spread 6.8 bps), `normal` style never quotes inside the
# spread, and the safety pause stands aside when the spread blows out or price jumps. Without the pause: +$0.52.
session_id: arcus_amd_mid
venue: arcus
account_index: 0            # the subaccount your API key is bound to (`bot keys` shows it)
market: AMD
mode: mid
live_enabled: false
capital_usd: 35
leverage_max: 5
bias: neutral
execution_style: normal     # r +/- max(h, spread/2): join the touch when the book is wider than 2h, never inside it
offset_bps: 0
spacing_bps: 3
levels_per_side: 1
order_size_usd: 10
inventory_cap_usd: 20
skew_kappa: 0.0             # kappa 1 (the default) also held up: +$1.85, 8/8 variants, better markout, less PnL
stop_loss_pct: 10
participation_cap_pct: 25
requote: {min_ticks: 2, min_frac_of_half_spread: 0.25}
safety_pause: {move_sigma_1s: 6, spread_x_median: 3, depth_frac_min: 0.3, resume_s: 30}
session: {duration: 24h, repeat: 30, windows_ist: [], skip_events: [cpi, fomc, nfp, earnings]}
# Tested quoting at all hours. The spec default (Mid off outside RTH, spacing x2, size x0.25) kept only +$0.46 of the $2.58.
off_hours: {spacing_mult: 1, size_mult: 1, allow_mid: true}
