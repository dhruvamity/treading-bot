data_dir: data
logs_dir: logs
reports_dir: reports
state_dir: state                 # per mode: state/{paper,testnet,live}.sqlite and state/heartbeat.{mode}
capital_usd_total: 100
alerts: {telegram_enabled: true, min_interval_s: 30, levels: [WARN, CRIT]}
risk:
  daily_loss_pct: 3.0
  drawdown_pct: 10.0
  drawdown_pct_dn: 8.0
  liq_distance_sigma: 4.0
  liq_resume_sigma: 6.0
  hedge_missing_s: 5.0
  heartbeat_timeout_s: 60.0
  arcus_pool_freeze_frac: 0.05
  arcus_pool_widen_frac: 0.20
  max_leverage_mm: 50.0           # Arcus maximum; each session's leverage_max (the market max, BTC/ETH 20x) binds
  max_leverage_dn: 3.0
  max_actions_per_filled_usd: 8.0
  feed_stale_s: 2.0
  max_error_rate: 0.05
sizing:                          # every dollar figure is a share of the capital (bot/common/sizing.py)
  capital_usd: auto              # auto: the Arcus subaccount's equity, re-read before each scan and at 00:00 UTC
                                 # by the bot; or a fixed amount (e.g. 250) to size for money not deposited yet
  paper_capital_usd: 100         # auto with no ARCUS_ADDRESS or an unfunded account (the Docker scout, paper)
  capital_frac: 1.0              # trade this share of the equity (0.5 = half; the rest is untouched cushion)
  max_capital_usd: null          # never size above this, however large the account grows (null = no cap)
  position_stop_pct: 1.0         # an open position down 1% of the capital: close it, then cool down
  daily_stop_pct: 2.0            # the UTC day down 2%: close, no new orders until 00:00 UTC
  kill_pct: 10.0                 # equity 10% below its peak: flatten and stop until `bot resume`
  go_pnl_day_pct: 0.25           # scout GO: average day and the last 24 h not worse than -0.25%
  go_tail_pnl_pct: 0.50          # scout GO: the last 6 h not worse than -0.50%
