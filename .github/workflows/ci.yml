name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: make install
      - run: make lint
      - run: make -C arcus type
      - run: make test
      - name: no credentials tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|secrets\.enc|[^/]*\.(pem|key|p12))$'; then echo "a credential file is tracked"; exit 1; fi
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.md'; then echo "a Telegram token is in the code"; exit 1; fi
